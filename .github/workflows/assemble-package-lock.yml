name: assemble-package-lock
on:
  push:
    paths:
      - 'web/package-lock.parts/**'
      - '.github/workflows/assemble-package-lock.yml'
    branches: [feat/bootstrap-foundation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble lockfile
        run: |
          set -euo pipefail
          ls -la web/package-lock.parts/
          cat web/package-lock.parts/part_*.txt > web/package-lock.json
          wc -c web/package-lock.json
          test "$(wc -c < web/package-lock.json)" -eq 61278
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: restore full npm package-lock for reproducible installs"
          git push
