name: restore-package-lock
on:
  workflow_dispatch:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "web/.lock-restore/**"
      - ".github/workflows/restore-package-lock.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4 5; do
            test -f "web/.lock-restore/part$i"
          done
          cat web/.lock-restore/part0 web/.lock-restore/part1 web/.lock-restore/part2 web/.lock-restore/part3 web/.lock-restore/part4 web/.lock-restore/part5 > web/package-lock.json
          SIZE=$(wc -c < web/package-lock.json)
          echo "assembled size=$SIZE"
          test "$SIZE" -eq 61278
          rm -rf web/.lock-restore
          rm -f .github/workflows/restore-package-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: restore full npm package-lock for reproducible installs"
          git push
